<meta name="robots" content="noindex">

@property --pct { syntax:'<percentage>'; inherits:false; initial-value:0%; }
</style>
</head>
<body>
<div class="page result-page">

<div class="result-hero">
  <!-- 레벨 배지 -->
  <div style="margin-bottom:16px;">
    <span id="lv-badge" style="
      display:inline-flex;align-items:center;gap:5px;
      padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;
      background:rgba(232,184,75,.15);color:var(--gold);border:1px solid rgba(232,184,75,.3);
    ">Level 1</span>
  </div>
  <!-- 점수 링 -->
  <div class="result-ring" id="result-ring">
    <div class="result-score" id="res-score">0</div>
    <div class="result-total" id="res-total">/0점</div>
  </div>
  <div class="result-grade" id="res-grade">완료!</div>
  <div class="result-sub"   id="res-sub"></div>
</div>

<!-- 통계 -->
<div class="result-stats">
  <div class="rs-cell">
    <div class="rs-cell__num" id="st-correct">0</div>
    <div class="rs-cell__label" id="st-c-lbl">정답</div>
  </div>
  <div class="rs-cell">
    <div class="rs-cell__num" id="st-wrong">0</div>
    <div class="rs-cell__label" id="st-w-lbl">오답</div>
  </div>
  <div class="rs-cell">
    <div class="rs-cell__num" id="st-hint">0</div>
    <div class="rs-cell__label" id="st-h-lbl">힌트</div>
  </div>
</div>

<!-- 액션 -->
<div class="result-actions">
  <button class="btn btn-ghost" onclick="retry()" id="btn-retry">🔄 다시</button>
  <button class="btn btn-gold"  onclick="levelUp()" id="btn-lvup">⬆ 다음 레벨</button>
</div>
<div style="padding:0 16px 10px;">
  <button class="btn btn-ghost" style="width:100%;" onclick="doShare()" id="btn-share">
    📤 <span id="share-lbl">결과 공유</span>
  </button>
</div>
<div style="padding:0 16px 16px;">
  <a href="/" class="btn btn-ghost" style="width:100%;display:flex;justify-content:center;">
    🏠 <span id="home-lbl">홈으로</span>
  </a>
</div>

<!-- 다음 도전 -->
<div class="next-section">
  <div class="next-label" id="next-lbl">다른 퀴즈 도전하기</div>
  <div class="next-grid">
    <button class="next-card" onclick="go('korea-sigungoo')">
      <span class="next-card__icon">🗺️</span>
      <span class="next-card__name" id="nc-ks">전국 시군</span>
      <span class="next-card__sub">161개 지역</span>
    </button>
    <button class="next-card" onclick="go('korea-seoul')">
      <span class="next-card__icon">🏙️</span>
      <span class="next-card__name" id="nc-se">서울 구</span>
      <span class="next-card__sub">25개 지역</span>
    </button>
    <button class="next-card" onclick="go('us-states')">
      <span class="next-card__icon">🌎</span>
      <span class="next-card__name" id="nc-us">미국 주</span>
      <span class="next-card__sub">50개 지역</span>
    </button>
    <button class="next-card" onclick="go('europe')">
      <span class="next-card__icon">🌍</span>
      <span class="next-card__name" id="nc-eu">유럽 나라</span>
      <span class="next-card__sub">47개 나라</span>
    </button>
    <button class="next-card" onclick="go('africa')">
      <span class="next-card__icon">🌍</span>
      <span class="next-card__name" id="nc-af">아프리카</span>
      <span class="next-card__sub">54개 나라</span>
    </button>
    <button class="next-card" onclick="go('asia')">
      <span class="next-card__icon">🌏</span>
      <span class="next-card__name" id="nc-as">아시아 나라</span>
      <span class="next-card__sub">46개 나라</span>
    </button>
    <button class="next-card" onclick="go('worldcup2026')">
      <span class="next-card__icon">🏆</span>
      <span class="next-card__name" id="nc-wc">2026 월드컵</span>
      <span class="next-card__sub">48개국</span>
    </button>
    <button class="next-card" onclick="go('japan')">
      <span class="next-card__icon">🗾</span>
      <span class="next-card__name" id="nc-jp">일본 도도부현</span>
      <span class="next-card__sub">47개 지역</span>
    </button>
    <button class="next-card" onclick="go('moon')">
      <span class="next-card__icon">🌙</span>
      <span class="next-card__name" id="nc-mo">달의 바다·분화구</span>
      <span class="next-card__sub">20개 지역</span>
    </button>
    <button class="next-card" onclick="go('moon-landing')">
      <span class="next-card__icon">🚀</span>
      <span class="next-card__name" id="nc-ml">달 탐사 착륙지</span>
      <span class="next-card__sub">16개 지역</span>
    </button>
    <button class="next-card" onclick="go('korea-specialty')">
      <span class="next-card__icon">🌾</span>
      <span class="next-card__name" id="nc-sp">지역 특성</span>
      <span class="next-card__sub">31개 지역</span>
    </button>
    <button class="next-card" onclick="go('world-mountains-rivers')">
      <span class="next-card__icon">⛰️</span>
      <span class="next-card__name" id="nc-mr">세계 산맥·강</span>
      <span class="next-card__sub">32개 지역</span>
    </button>
  </div>
</div>

</div><!-- .page -->
<div class="toast" id="toast"></div>

<script>
function showToast(msg,ms=2200){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),ms);}
</script>
<script src="/js/i18n.js"></script>
<script>
(async()=>{
  const p=new URLSearchParams(location.search);
  const lang=p.get('lang')||localStorage.getItem('qlang')||(navigator.language?.startsWith('ko')?'ko':'en');
  await I18n.init(lang);
  const isKo=lang==='ko';

  const mapId  = p.get('map')||'korea-sigungoo';
  const level  = parseInt(p.get('level')||'1');
  const score  = parseFloat(p.get('score')||'0');
  const total  = parseInt(p.get('total')||'1');
  const correct= parseInt(p.get('correct')||'0');
  const wrong  = parseInt(p.get('wrong')||'0');
  const hints  = parseInt(p.get('hints')||'0');
  const pct    = score/total;

  // 레벨 배지
  document.getElementById('lv-badge').textContent=`Level ${level}`;

  // 점수 링 애니메이션
  const ring=document.getElementById('result-ring');
  ring.style.setProperty('--pct',`${Math.round(pct*100)}%`);
  document.getElementById('res-score').textContent=score%1===0?score:score.toFixed(1);
  document.getElementById('res-total').textContent=`/${total}${isKo?'점':' pts'}`;

  // 지도명 + 등급
  const mapNames={
    'korea-sigungoo':isKo?'전국 시군':'Korea Si/Gun',
    'korea-seoul':isKo?'서울 구':'Seoul Wards',
    'us-states':isKo?'미국 주':'US States',
    'europe':isKo?'유럽 나라':'European Countries',
    'africa':isKo?'아프리카 나라':'African Countries',
    'worldcup2026':isKo?'2026 월드컵':'2026 World Cup',
    'korea-specialty':isKo?'한국 지역 특성':'Korean Regional Features',
    'japan':isKo?'일본 도도부현':'Japan Prefectures',
    'moon':isKo?'달의 바다·분화구':'Moon Seas & Craters',
    'moon-landing':isKo?'달 탐사 착륙지':'Moon Landing Sites',
    'world-mountains-rivers':isKo?'세계 산맥·강':'World Mountains & Rivers',
    'asia':isKo?'아시아 나라':'Asian Countries',
  };
  document.getElementById('res-sub').textContent=(mapNames[mapId]||mapId)+` · Level ${level}`;

  let grade='';
  if(pct>=.95)       grade=isKo?'완벽해요! 🏆':'Perfect! 🏆';
  else if(pct>=.8)   grade=isKo?'훌륭해요! 🎉':'Excellent! 🎉';
  else if(pct>=.6)   grade=isKo?'잘했어요! 👍':'Well done! 👍';
  else if(pct>=.4)   grade=isKo?'조금 더 연습을 💪':'Keep going! 💪';
  else               grade=isKo?'다시 도전해보세요 🗺️':'Try again! 🗺️';
  document.getElementById('res-grade').textContent=grade;

  // 통계
  document.getElementById('st-correct').textContent=correct;
  document.getElementById('st-wrong').textContent=wrong;
  document.getElementById('st-hint').textContent=hints;
  if(!isKo){
    document.getElementById('st-c-lbl').textContent='Correct';
    document.getElementById('st-w-lbl').textContent='Wrong';
    document.getElementById('st-h-lbl').textContent='Hints';
  }

  // 버튼
  if(!isKo){
    document.getElementById('btn-retry').textContent='🔄 Retry';
    document.getElementById('btn-lvup').textContent=`⬆ Level ${Math.min(level+1,3)}`;
    document.getElementById('share-lbl').textContent='Share';
    document.getElementById('home-lbl').textContent='Home';
    document.getElementById('next-lbl').textContent='Try Another Quiz';
    document.getElementById('nc-ks').textContent='Korea Si/Gun';
    document.getElementById('nc-se').textContent='Seoul Wards';
    document.getElementById('nc-us').textContent='US States';
    document.getElementById('nc-eu').textContent='Europe';
    document.getElementById('nc-af').textContent='Africa';
    document.getElementById('nc-wc').textContent='2026 World Cup';
    document.getElementById('nc-sp').textContent='Regional Features';
    document.getElementById('nc-as').textContent='Asia';
    document.getElementById('nc-jp').textContent='Japan';
    document.getElementById('nc-mo').textContent='Moon Seas & Craters';
    document.getElementById('nc-ml').textContent='Moon Landing Sites';
    document.getElementById('nc-mr').textContent='World Mountains & Rivers';
  }
  if(level>=3) document.getElementById('btn-lvup').style.display='none';

  // 함수들
  window.retry =()=>location.href=`/quiz?map=${mapId}&lang=${lang}&level=${level}`;
  window.levelUp=()=>location.href=`/quiz?map=${mapId}&lang=${lang}&level=${Math.min(level+1,3)}`;
  window.go    =(m)=>location.href=`/quiz?map=${m}&lang=${lang}&level=1`;
  window.doShare=async()=>{
    const mn=mapNames[mapId]||mapId;
    const txt=isKo
      ?`🗺️ 지도퀴즈 ${mn} Level${level}\n${score}/${total}점 (${Math.round(pct*100)}%)\nhttps://korean-cityquiz01.pages.dev`
      :`🗺️ 지도퀴즈 ${mn} Level${level}\n${score}/${total} pts (${Math.round(pct*100)}%)\nhttps://korean-cityquiz01.pages.dev`;
    if(navigator.share){try{await navigator.share({text:txt});return;}catch{}}
    try{await navigator.clipboard.writeText(txt);showToast(isKo?'📋 복사됐어요!':'📋 Copied!');}
    catch{showToast(isKo?'공유 실패':'Share failed');}
  };
})();
</script>
</body>
</html>
