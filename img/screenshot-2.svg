<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#112040"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D078"/>
      <stop offset="100%" stop-color="#E8B84B"/>
    </linearGradient>
    <linearGradient id="mapbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2e"/>
      <stop offset="100%" stop-color="#131f35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="88" fill="rgba(12,18,32,0.95)"/>
  <text x="20" y="26" font-family="Arial" font-size="14" fill="white" opacity="0.7">9:41</text>
  <circle cx="30" cy="56" r="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="30" y="62" font-family="Arial" font-size="16" text-anchor="middle" fill="#EDF2F7">‹</text>
  <text x="195" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#EDF2F7" opacity="0.5">전국 시군</text>
  <text x="195" y="68" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#EDF2F7">Level 1 · 보기 4개</text>

  <!-- Progress bar -->
  <text x="20" y="104" font-family="Arial" font-size="11" fill="#EDF2F7" opacity="0.5">3 / 10</text>
  <rect x="60" y="96" width="240" height="3" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="96" width="72" height="3" rx="2" fill="url(#gold)"/>
  <text x="360" y="104" font-family="Arial" font-size="12" font-weight="bold" text-anchor="end" fill="#E8B84B">2점</text>

  <!-- Map area -->
  <rect x="0" y="112" width="390" height="280" fill="url(#mapbg)"/>

  <!-- Simplified Korea map outline -->
  <g transform="translate(50, 130)" opacity="0.9">
    <!-- Province regions with colors -->
    <path d="M120,10 L160,8 L185,20 L200,50 L195,80 L170,90 L140,85 L110,75 L95,50 L100,25 Z"
          fill="rgba(74,144,217,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M160,8 L200,5 L230,15 L245,40 L235,65 L200,70 L195,50 L185,20 Z"
          fill="rgba(87,168,107,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <!-- Highlighted region (경상남도) -->
    <path d="M160,120 L200,115 L220,130 L215,165 L190,175 L155,170 L145,145 Z"
          fill="#E8B84B" stroke="#F5D078" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M95,50 L140,45 L140,85 L95,90 L75,75 L80,55 Z"
          fill="rgba(157,120,212,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M140,85 L195,80 L200,115 L160,120 L130,110 L125,90 Z"
          fill="rgba(217,110,58,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M75,75 L95,90 L125,90 L130,120 L100,130 L70,115 L60,90 Z"
          fill="rgba(62,189,189,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M100,130 L145,145 L155,170 L130,185 L95,175 L85,150 Z"
          fill="rgba(176,120,64,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M190,175 L215,165 L230,190 L220,210 L195,215 L175,200 Z"
          fill="rgba(123,176,80,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <!-- Jeju -->
    <ellipse cx="120" cy="230" rx="30" ry="18"
             fill="rgba(96,180,255,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  </g>

  <!-- Map tip -->
  <rect x="130" y="350" width="130" height="28" rx="14"
        fill="rgba(232,184,75,0.15)" stroke="rgba(232,184,75,0.4)" stroke-width="1"/>
  <text x="195" y="369" font-family="Arial" font-size="12" text-anchor="middle" fill="#E8B84B">📍 강조된 지역은?</text>

  <!-- Quiz panel -->
  <rect x="0" y="392" width="390" height="452" fill="#0C1220"/>

  <!-- Question -->
  <rect x="16" y="404" width="358" height="44" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="195" y="432" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">
    <tspan fill="#E8B84B">강조된 지역</tspan>의 이름은?
  </text>

  <!-- Hint button -->
  <rect x="16" y="458" width="120" height="34" rx="17"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="76" y="480" font-family="Arial" font-size="12" text-anchor="middle" fill="#E8B84B">💡 힌트 (선택)</text>

  <!-- Choices -->
  <rect x="16" y="504" width="172" height="52" rx="12"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="102" y="536" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">창원시</text>

  <rect x="202" y="504" width="172" height="52" rx="12"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="288" y="536" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">진주시</text>

  <rect x="16" y="568" width="172" height="52" rx="12"
        fill="rgba(62,207,178,0.12)" stroke="rgba(62,207,178,0.5)" stroke-width="1.5"/>
  <text x="102" y="600" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#3ECFB2">거제시 ✓</text>

  <rect x="202" y="568" width="172" height="52" rx="12"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="288" y="600" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">통영시</text>

  <!-- Feedback -->
  <rect x="16" y="634" width="358" height="40" rx="10"
        fill="rgba(62,207,178,0.1)" stroke="rgba(62,207,178,0.25)" stroke-width="1"/>
  <text x="195" y="660" font-family="Arial" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#3ECFB2">✓ 정답! (+1점)</text>

  <!-- Next button -->
  <rect x="80" y="688" width="230" height="48" rx="24" fill="#E8B84B"/>
  <text x="195" y="718" font-family="Arial" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#0C1220">다음 (3) →</text>

  <!-- Bottom caption -->
  <rect x="0" y="770" width="390" height="74" fill="rgba(12,18,32,0.95)"/>
  <text x="195" y="802" font-family="Arial" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">지도에서 강조된 지역을 맞혀요!</text>
  <text x="195" y="828" font-family="Arial" font-size="13"
        text-anchor="middle" fill="#EDF2F7" opacity="0.6">3초 후 자동으로 다음 문제로 넘어가요</text>
</svg>
