<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#112040"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D078"/>
      <stop offset="100%" stop-color="#E8B84B"/>
    </linearGradient>
    <linearGradient id="scorebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152035"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <radialGradient id="ringglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="52" fill="rgba(12,18,32,0.95)"/>
  <text x="20" y="26" font-family="Arial" font-size="14" fill="white" opacity="0.7">9:41</text>
  <text x="195" y="34" font-family="Arial" font-size="14" text-anchor="middle" fill="#EDF2F7" opacity="0.6">결과</text>

  <!-- Result card -->
  <rect x="20" y="68" width="350" height="300" rx="20" fill="url(#scorebg)"
        stroke="rgba(232,184,75,0.2)" stroke-width="1.5"/>

  <!-- Glow behind ring -->
  <circle cx="195" cy="185" r="90" fill="url(#ringglow)"/>

  <!-- Score ring -->
  <circle cx="195" cy="185" r="70" fill="none" stroke="rgba(232,184,75,0.15)" stroke-width="12"/>
  <circle cx="195" cy="185" r="70" fill="none" stroke="url(#gold)" stroke-width="12"
          stroke-dasharray="395" stroke-dashoffset="79" stroke-linecap="round"
          transform="rotate(-90 195 185)"/>

  <!-- Score text -->
  <text x="195" y="175" font-family="Georgia,serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">8.5</text>
  <text x="195" y="200" font-family="Arial" font-size="14"
        text-anchor="middle" fill="#EDF2F7" opacity="0.6">/ 10점</text>

  <!-- Grade badge -->
  <rect x="150" y="218" width="90" height="30" rx="15"
        fill="rgba(232,184,75,0.15)" stroke="rgba(232,184,75,0.4)" stroke-width="1"/>
  <text x="195" y="238" font-family="Arial" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">🏆 훌륭해요!</text>

  <!-- Stats -->
  <g transform="translate(195, 298)">
    <rect x="-150" y="-20" width="90" height="48" rx="10" fill="rgba(62,207,178,0.08)"/>
    <text x="-105" y="-2" font-family="Arial" font-size="11" text-anchor="middle" fill="#3ECFB2" opacity="0.8">정답</text>
    <text x="-105" y="20" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#3ECFB2">9</text>

    <rect x="-40" y="-20" width="80" height="48" rx="10" fill="rgba(255,255,255,0.04)"/>
    <text x="0" y="-2" font-family="Arial" font-size="11" text-anchor="middle" fill="#EDF2F7" opacity="0.5">힌트</text>
    <text x="0" y="20" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#EDF2F7">1</text>

    <rect x="60" y="-20" width="90" height="48" rx="10" fill="rgba(255,107,107,0.08)"/>
    <text x="105" y="-2" font-family="Arial" font-size="11" text-anchor="middle" fill="#FF6B6B" opacity="0.8">오답</text>
    <text x="105" y="20" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#FF6B6B">1</text>
  </g>

  <!-- Map label -->
  <text x="195" y="395" font-family="Arial" font-size="12" text-anchor="middle"
        fill="#EDF2F7" opacity="0.4">전국 시군 · Level 1 · 보기 4개</text>

  <!-- Action buttons -->
  <rect x="20" y="415" width="168" height="52" rx="26"
        fill="rgba(232,184,75,0.12)" stroke="rgba(232,184,75,0.3)" stroke-width="1.5"/>
  <text x="104" y="447" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">↺ 다시 하기</text>

  <rect x="202" y="415" width="168" height="52" rx="26" fill="#E8B84B"/>
  <text x="286" y="447" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#0C1220">다른 지도 →</text>

  <!-- Quiz list title -->
  <text x="20" y="500" font-family="Arial" font-size="13" font-weight="bold"
        fill="#EDF2F7" opacity="0.8">다른 퀴즈도 도전해보세요</text>

  <!-- Other quiz cards -->
  <rect x="16" y="514" width="172" height="72" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="102" y="542" font-family="Arial" font-size="22" text-anchor="middle">🏙️</text>
  <text x="102" y="562" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EDF2F7">서울 구</text>
  <text x="102" y="576" font-family="Arial" font-size="10" text-anchor="middle" fill="#EDF2F7" opacity="0.5">25개 자치구</text>

  <rect x="202" y="514" width="172" height="72" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="288" y="542" font-family="Arial" font-size="22" text-anchor="middle">🌍</text>
  <text x="288" y="562" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EDF2F7">유럽 나라</text>
  <text x="288" y="576" font-family="Arial" font-size="10" text-anchor="middle" fill="#EDF2F7" opacity="0.5">47개 국가</text>

  <rect x="16" y="600" width="172" height="72" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="102" y="628" font-family="Arial" font-size="22" text-anchor="middle">🇺🇸</text>
  <text x="102" y="648" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EDF2F7">미국 주</text>
  <text x="102" y="662" font-family="Arial" font-size="10" text-anchor="middle" fill="#EDF2F7" opacity="0.5">50개 주</text>

  <rect x="202" y="600" width="172" height="72" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="288" y="628" font-family="Arial" font-size="22" text-anchor="middle">🏆</text>
  <text x="288" y="648" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EDF2F7">2026 월드컵</text>
  <rect x="262" y="656" width="52" height="16" rx="8" fill="rgba(232,184,75,0.2)"/>
  <text x="288" y="668" font-family="Arial" font-size="9" text-anchor="middle" fill="#E8B84B" font-weight="bold">🔥 HOT</text>

  <!-- Bottom caption -->
  <rect x="0" y="720" width="390" height="124" fill="rgba(12,18,32,0.95)"/>

  <!-- Stars -->
  <text x="195" y="760" font-family="Arial" font-size="32" text-anchor="middle">⭐⭐⭐⭐⭐</text>
  <text x="195" y="795" font-family="Arial" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">점수와 정답률 한눈에 확인!</text>
  <text x="195" y="825" font-family="Arial" font-size="13"
        text-anchor="middle" fill="#EDF2F7" opacity="0.6">틀린 문제는 바로 다시 도전할 수 있어요</text>
</svg>
