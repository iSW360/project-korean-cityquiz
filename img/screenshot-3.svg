<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#112040"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D078"/>
      <stop offset="100%" stop-color="#E8B84B"/>
    </linearGradient>
    <linearGradient id="mapbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2e"/>
      <stop offset="100%" stop-color="#131f35"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="88" fill="rgba(12,18,32,0.95)"/>
  <text x="20" y="26" font-family="Arial" font-size="14" fill="white" opacity="0.7">9:41</text>
  <circle cx="30" cy="56" r="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="30" y="62" font-family="Arial" font-size="16" text-anchor="middle" fill="#EDF2F7">‹</text>
  <text x="195" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#EDF2F7" opacity="0.5">유럽 나라</text>
  <text x="195" y="68" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#EDF2F7">Level 2 · 보기 8개 · 15초</text>

  <!-- Progress + Timer -->
  <text x="20" y="104" font-family="Arial" font-size="11" fill="#EDF2F7" opacity="0.5">5 / 10</text>
  <rect x="60" y="96" width="200" height="3" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="96" width="100" height="3" rx="2" fill="url(#gold)"/>
  <text x="310" y="104" font-family="Arial" font-size="12" font-weight="bold" text-anchor="end" fill="#E8B84B">4점</text>
  <!-- Timer circle -->
  <circle cx="360" cy="100" r="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <circle cx="360" cy="100" r="18" fill="none" stroke="#3ECFB2" stroke-width="3"
          stroke-dasharray="75 38" stroke-dashoffset="0" transform="rotate(-90 360 100)"/>
  <text x="360" y="106" font-family="Arial" font-size="13" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">8</text>

  <!-- Map area (Europe) -->
  <rect x="0" y="112" width="390" height="260" fill="url(#mapbg)"/>

  <!-- Simplified Europe map -->
  <g transform="translate(40, 120)" opacity="0.9">
    <!-- Background countries -->
    <path d="M100,20 L130,15 L145,30 L140,50 L115,55 L95,45 Z"
          fill="rgba(74,144,217,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M140,25 L175,20 L190,35 L185,55 L160,60 L140,50 Z"
          fill="rgba(74,144,217,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <!-- Highlighted: France -->
    <path d="M80,60 L120,55 L135,70 L130,100 L110,115 L75,110 L60,90 L65,68 Z"
          fill="#E8B84B" stroke="#F5D078" stroke-width="1.5"/>
    <path d="M135,55 L175,50 L190,65 L185,90 L160,100 L135,90 L130,70 Z"
          fill="rgba(62,189,189,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M60,90 L95,95 L100,130 L80,145 L50,130 L45,105 Z"
          fill="rgba(212,160,48,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M95,95 L135,90 L145,110 L140,140 L115,150 L95,135 L100,110 Z"
          fill="rgba(157,120,212,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M185,65 L220,60 L235,80 L230,105 L205,110 L185,95 Z"
          fill="rgba(87,168,107,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M160,100 L200,100 L210,125 L195,145 L165,140 L150,120 Z"
          fill="rgba(217,110,58,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <path d="M50,130 L85,140 L90,165 L65,175 L40,160 L38,140 Z"
          fill="rgba(74,144,217,0.22)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  </g>

  <!-- Quiz panel -->
  <rect x="0" y="372" width="390" height="472" fill="#0C1220"/>

  <!-- Question -->
  <rect x="16" y="382" width="358" height="44" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="195" y="410" font-family="Arial" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#EDF2F7">
    <tspan fill="#E8B84B">강조된 지역</tspan>의 이름은?
  </text>

  <!-- 8 Choices (2x4 grid) -->
  <g font-family="Arial" font-size="12" font-weight="bold">
    <rect x="16" y="438" width="82" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="57" y="466" text-anchor="middle" fill="#EDF2F7">독일</text>

    <rect x="106" y="438" width="82" height="44" rx="10" fill="rgba(62,207,178,0.12)" stroke="rgba(62,207,178,0.5)" stroke-width="1.5"/>
    <text x="147" y="466" text-anchor="middle" fill="#3ECFB2">프랑스 ✓</text>

    <rect x="196" y="438" width="82" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="237" y="466" text-anchor="middle" fill="#EDF2F7">스페인</text>

    <rect x="286" y="438" width="88" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="330" y="466" text-anchor="middle" fill="#EDF2F7">이탈리아</text>

    <rect x="16" y="492" width="82" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="57" y="520" text-anchor="middle" fill="#EDF2F7">영국</text>

    <rect x="106" y="492" width="82" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="147" y="520" text-anchor="middle" fill="#EDF2F7">폴란드</text>

    <rect x="196" y="492" width="82" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="237" y="520" text-anchor="middle" fill="#EDF2F7">스위스</text>

    <rect x="286" y="492" width="88" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="330" y="520" text-anchor="middle" fill="#EDF2F7">네덜란드</text>
  </g>

  <!-- Feedback -->
  <rect x="16" y="548" width="358" height="40" rx="10"
        fill="rgba(62,207,178,0.1)" stroke="rgba(62,207,178,0.25)" stroke-width="1"/>
  <text x="195" y="574" font-family="Arial" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#3ECFB2">✓ 정답! (+1점)</text>

  <!-- Hint box -->
  <rect x="16" y="600" width="358" height="44" rx="10"
        fill="rgba(232,184,75,0.08)" stroke="rgba(232,184,75,0.2)" stroke-width="1"/>
  <text x="195" y="628" font-family="Arial" font-size="12"
        text-anchor="middle" fill="#E8B84B" opacity="0.9">💡 서유럽 국가. 수도는 파리. 에펠탑의 나라.</text>

  <!-- Next button -->
  <rect x="80" y="658" width="230" height="48" rx="24" fill="#E8B84B"/>
  <text x="195" y="688" font-family="Arial" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#0C1220">다음 (2) →</text>

  <!-- Bottom caption -->
  <rect x="0" y="760" width="390" height="84" fill="rgba(12,18,32,0.95)"/>
  <text x="195" y="795" font-family="Arial" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#E8B84B">8개 보기 + 15초 제한!</text>
  <text x="195" y="825" font-family="Arial" font-size="13"
        text-anchor="middle" fill="#EDF2F7" opacity="0.6">정답 후엔 지역 힌트 정보도 함께 확인</text>
</svg>
